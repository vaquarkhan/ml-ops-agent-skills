name: gcp-vertex-mlops
description: GCP Vertex AI MLOps with BigQuery features, Feast, and Cloud Run serving.
platform:
  cloud: gcp
  training: vertex-ai
  warehouse: bigquery
  feature_store: feast
  serving: cloud-run
skills:

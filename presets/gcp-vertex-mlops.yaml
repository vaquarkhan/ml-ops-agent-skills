  - mlflow-model-registry-and-continuous-training
  - llm-serving-and-inference-optimization
environment_variables:
  MLFLOW_TRACKING_URI: "http://mlflow.internal:5000"
  GOOGLE_CLOUD_PROJECT: "mlops-platform"

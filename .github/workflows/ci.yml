# GitHub Actions CI for MLOps Agent Skills

name: MLOps CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skills structure
        run: python scripts/validate-skills.py
      - name: Validate asset registry
        run: python scripts/validate-assets.py

  test-light:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependencies
        run: pip install -r requirements-minimal.txt
      - name: Run lightweight tests
        run: pytest tests/ -q --no-cov

  test-full:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install full dependencies
        run: pip install -r requirements.txt
      - name: Run full test suite
        run: pytest tests/ -v --cov=data --cov=feature_store --cov=training --cov=serving --cov=monitoring --cov=governance --cov=zkml --cov-fail-under=85
      - name: Validate Kubernetes manifests
        run: python training/validate_k8s.py

  eval:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run skill routing benchmark
        run: python evals/run.py

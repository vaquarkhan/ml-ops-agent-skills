# GitHub Actions CI pipeline for MLOps platform

name: MLOps CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=data --cov=feature_store --cov=training --cov=serving --cov=monitoring --cov=zkml --cov=governance

      - name: Validate Kubernetes manifests
        run: python training/validate_k8s.py

      - name: Fairness CI gate
        run: pytest tests/test_governance.py::TestGovernancePipeline::test_fairness_gate_fails_on_bias -v
